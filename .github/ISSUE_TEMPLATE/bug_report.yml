name: Bug report
description: Report a result or behavior of the runtime or the player that is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities privately, as the [security policy](https://github.com/assesskit/assesskit/security/policy)
        describes, not here.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@assesskit/runtime"
        - "@assesskit/player"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version from `npm ls @assesskit/runtime` or `npm ls @assesskit/player`, or the commit if you build from source.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Deno
        - Bun
        - Browser
        - Other
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: The output of `node --version`, or the browser and its version.
      placeholder: v22.18.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The document, or the sequence of actions, that fails, with the smallest code that runs as pasted.
      render: typescript
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Specification section
      description: The section of the specifications that defines the behavior you expected, such as INFO §5.150. The IDs are in docs/runtime/evidence.md, under Citations.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with the full error message if there is one.
    validations:
      required: true
