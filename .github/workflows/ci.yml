name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Whether the change touches the runtime, its examples, its harness or this workflow. The xsd, corpus and bench jobs run only
  # then. A job that is skipped passes a required check. A change that cannot be compared with its base, such as the
  # first push of a branch, counts as touching the runtime.
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The runtime, its examples, the harness (scripts/, validation/ and the files of the root that configure
          # it) and this workflow.
          RUNTIME_PATHS: ^(packages/runtime/|examples/runtime/|scripts/|validation/|\.github/workflows/ci\.yml$|[^/]+\.(json|ts|ya?ml)$)
        run: |
          changed="$RUNNER_TEMP/changed.txt"
          if [ -n "$BASE" ] && git diff --name-only --no-renames "$BASE" HEAD > "$changed" && ! grep -Eq "$RUNTIME_PATHS" "$changed"; then
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:standards
      - run: pnpm knip
      - run: pnpm check:packages
      - run: pnpm check:release
      # Packs the packages, installs them into a scratch project, imports every subpath in Node.js and type-checks them.
      - run: pnpm check:tarballs
      - run: pnpm check:licenses
      - run: pnpm check:audit
      - run: pnpm compat
      - run: pnpm docs:api
      # Version and Dependabot pull requests change package files without a changeset of their own.
      - if: >-
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/') &&
          github.actor != 'dependabot[bot]'
        run: pnpm changeset status --since=origin/main

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The coverage floors (vitest.config.ts) are checked once, on the oldest supported Node.js.
      - if: matrix.node == 22
        run: pnpm test:coverage
      - if: matrix.node != 22
        run: pnpm test

  # The benchmarks of the runtime on generated inputs and on the 1EdTech examples, which it times against Longsight qti3-core.
  # The job fails when the fastest sample of a benchmark is above its budget (docs/runtime/performance.md).
  bench:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm corpus
      - run: pnpm --filter @assesskit/runtime bench

  # The time to mount the player, with the CPU slowed 4 times in Chromium, against the budgets of test/mount-budgets.ts
  # (docs/player/size.md).
  player-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @assesskit/player bench

  # The rendering tests of the player, and its tests that render the 1EdTech examples, in the current Chromium, Firefox and
  # WebKit, and its tests of the asset gate over the same examples, which run in Node.
  browsers:
    runs-on: ubuntu-latest
    # The runner has no sound card: scripts/linux-audio.sh gives the browsers an output, and a test that needs audio fails without it.
    env:
      REQUIRE_AUDIO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm schemas
      - run: pnpm corpus
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get install -y pulseaudio
      - run: scripts/linux-audio.sh
      # Chromium runs with coverage, the one engine that reports it, and holds the floors of the folders that draw a page.
      - run: pnpm test:coverage:browser
      - run: BROWSERS=firefox,webkit pnpm test:browser
      - run: pnpm test:corpus --project '!runtime*'

  # Removes each security rule that scripts/check-rules.ts lists from a copy of the code, and fails when its test still passes.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The rules of the code that runs in a page are checked in Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:rules

  # The built code of the player in the oldest browsers of its baseline, in the container images of the Playwright
  # releases that ship them (docs/player/baseline.md).
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm compat:engines

  # Tests of the runtime and of its examples that read the 1EdTech examples and the W3C regular expression suite, downloaded at the commits and hashes
  # that scripts/corpus.lock.json pins. The tests of the player that read them run in the browsers job.
  corpus:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm corpus
      - run: pnpm test:corpus --project '!player*'

  # Tests of the runtime and of its examples that validate against the official XSDs, downloaded at the hashes that
  # packages/runtime/src/node/schema-files.json pins, and that read the 1EdTech examples.
  xsd:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm schemas
      - run: pnpm corpus
      - run: pnpm test:xsd
