<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>assesskit: QTI 3.0 runtime and player for JavaScript and TypeScript</title>
  <rect width="1280" height="640" fill="#0f4c5c"/>
  <rect x="0" y="0" width="16" height="640" fill="#e0a458"/>
  <path d="M880 330l110 110 230-250" fill="none" stroke="#e0a458" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M870 500h340" stroke="#4d8896" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="80" y="150" font-size="96" font-weight="700">assesskit</text>
