    <text x="80" y="536">@assesskit/custom-interactions</text>
  </g>
  <text x="80" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#e0a458">assesskit.wakan.dev</text>
