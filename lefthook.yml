pre-commit:
  commands:
    biome:
      glob: "*.{ts,js,json,jsonc,md,yaml,yml}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

# A branch's jobs run on GitHub, on its pull request; the hook guards what reaches main.
pre-push:
  only:
    - ref: main
  parallel: true
  commands:
    # Two examples link measurekit and interopkit, which CI builds at the commits of their locks; a checkout beside them holds
    # another commit, so they are left to CI here.
    typecheck:
      run: pnpm -r --filter '!@assesskit/example-lms-integration' --filter '!@assesskit/example-cat-with-measurekit' typecheck && pnpm exec tsc -p tsconfig.json
    test:
      run: pnpm test --project '!examples'
    knip:
      run: pnpm knip
